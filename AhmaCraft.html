<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AhmaCraft</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#193321;color:white;font-family:system-ui,Arial}header{text-align:center;padding:14px;background:#183b27;border-bottom:4px solid #315f35}h1{margin:0;font-size:clamp(28px,7vw,42px);text-shadow:3px 3px #142718}header p{margin:4px 0;color:#d8f4d1}main{max-width:900px;margin:auto;padding:14px}.panel{background:#23452d;border:3px solid #477b45;border-radius:14px;padding:12px}#world{position:relative;height:min(58vh,440px);min-height:280px;overflow:hidden;border:4px solid #d9edff;border-radius:10px;background:linear-gradient(#77d5ff 0 62%,#7cc85b 62%)}.sun{position:absolute;right:12%;top:9%;width:54px;height:54px;background:#ffe66b;box-shadow:0 0 28px #fff3a6}.cloud{position:absolute;background:white;border-radius:20px;width:85px;height:22px;top:18%;left:14%;box-shadow:18px -12px 0 -2px white,36px 0 0 -2px white}.hill{position:absolute;bottom:28%;left:-8%;width:60%;height:28%;background:#6dbd55;transform:skewY(-13deg);border-top:5px solid #479d43}.hill.two{left:52%;width:65%;height:23%;background:#5aa94b}.ground{position:absolute;bottom:0;height:30%;width:100%;background:repeating-linear-gradient(90deg,#98623c 0 48px,#865332 48px 52px);border-top:12px solid #59b847}.tree{position:absolute;bottom:30%;left:22%;width:24px;height:80px;background:#80502e}.tree:before{content:"";position:absolute;width:78px;height:76px;background:#328c43;left:-27px;top:-54px;clip-path:polygon(50% 0,100% 36%,82% 36%,100% 68%,0 68%,18% 36%,0 36%)}.tree.two{left:76%;height:65px;transform:scale(.8)}#placed{position:absolute;inset:0;pointer-events:none}.block{position:absolute;width:42px;height:42px;border:2px solid #284b2a;box-shadow:inset -7px -7px #0002;pointer-events:auto;cursor:pointer}.grass{background:linear-gradient(#57bd48 0 25%,#956039 25%)}.stone{background:#92999b}.wood{background:#a87543}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;color:#17311d;background:#d8f4c7;box-shadow:0 4px #87b978}button:active{transform:translateY(2px);box-shadow:0 2px #87b978}#hint{text-align:center;color:#e0f4df;font-size:13px;margin:10px 0 0}footer{text-align:center;color:#b9d4bd;font-size:12px;padding:14px}
</style></head><body><header><h1>🧱 AhmaCraft</h1><p>Твой маленький блочный мир</p></header><main><section class="panel"><div id="world"><div class="sun"></div><div class="cloud"></div><div class="hill"></div><div class="hill two"></div><div class="tree"></div><div class="tree two"></div><div class="ground"></div><div id="placed"></div></div><div class="controls"><button data-type="grass">🟩 Трава</button><button data-type="stone">🪨 Камень</button><button data-type="wood">🪵 Дерево</button><button id="clear">Очистить блоки</button></div><p id="hint">Выбери блок, затем нажми в мире, чтобы поставить его. Нажми на поставленный блок, чтобы убрать.</p></section></main><footer>AhmaCraft — демо-страница игры</footer><script>
const world=document.getElementById('world'),placed=document.getElementById('placed');let selected='grass';document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.type;document.getElementById('hint').textContent='Выбран блок: '+b.textContent+'. Нажми в мире, чтобы поставить его.';}));world.addEventListener('click',e=>{if(e.target.classList.contains('block')){e.target.remove();return;}const r=world.getBoundingClientRect(),s=42,x=Math.max(0,Math.min(r.width-s,e.clientX-r.left-s/2)),y=Math.max(0,Math.min(r.height-s,e.clientY-r.top-s/2)),b=document.createElement('div');b.className='block '+selected;b.style.left=x+'px';b.style.top=y+'px';placed.appendChild(b);});document.getElementById('clear').addEventListener('click',()=>placed.replaceChildren());
</script></body></html>
