
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AhmaCraft</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#83d5ff;overflow:hidden;touch-action:none}
header{height:46px;background:#245c35;color:white;text-align:center;padding:11px;font-size:22px;font-weight:bold}
#tools,#controls{height:48px;background:#303030;display:flex;align-items:center;justify-content:center;gap:5px}
button{padding:9px 10px;border:2px solid #888;border-radius:8px;background:#555;color:white;font-weight:bold}
.active{background:#218b43;border-color:white}
canvas{display:block;width:100%;height:calc(100dvh - 142px);touch-action:none}
#controls button{min-width:65px;font-size:22px}
</style>
</head>
<body>
<header>🧱 AhmaCraft</header>
<div id="tools">
<button id="break" class="active">⛏️ Ломать</button>
<button id="place">🧱 Ставить</button>
<button id="grass" class="active">🌿</button>
<button id="stone">🪨</button>
<button id="wood">🪵</button>
</div>
<canvas id="game"></canvas>
<div id="controls">
<button id="left">⬅️</button>
<button id="jump">⬆️</button>
<button id="right">➡️</button>
</div>
<script>
const c=document.getElementById('game');
const ctx=c.getContext('2d');
const S=32,W=90,H=24;
let map=Array.from({length:H},()=>Array(W).fill(0));
let ground=[];
for(let x=0;x<W;x++){
 let y=12+Math.floor(Math.sin(x*.19)*2+Math.sin(x*.055)*2);
 ground[x]=y;
 for(let z=y;z<H;z++)map[z][x]=z===y?1:z<y+4?2:3;
}
function tree(x){
 let y=ground[x];
 for(let z=y-4;z<y;z++)if(z>=0)map[z][x]=4;
 for(let z=y-7;z<y-3;z++)
 for(let a=x-2;a<=x+2;a++)
 if(a>=0&&a<W&&z>=0)map[z][a]=5;
}
[10,25,43,61,78].forEach(tree);
const colors={1:'#59b83e',2:'#986333',3:'#858b92',4:'#80502d',5:'#238c38'};
let p={x:4*S,y:5*S,w:22,h:29,vy:0,ground:false};
let camera=0,mode='break',selected=1;
let keys={left:false,right:false,jump:false};

function resize(){
 let d=Math.min(devicePixelRatio||1,2);
 c.width=c.clientWidth*d;
 c.height=c.clientHeight*d;
 ctx.setTransform(d,0,0,d,0,0);
}
new ResizeObserver(resize).observe(c);
window.addEventListener('resize',resize);

function block(x,y){
 return x>=0&&x<W&&y>=0&&y<H?map[y][x]:0;
}
function draw(){
 let w=c.clientWidth,h=c.clientHeight;
 ctx.clearRect(0,0,w,h);
 ctx.fillStyle='#83d5ff';
 ctx.fillRect(0,0,w,h);
 ctx.fillStyle='white';
 for(let i=0;i<5;i++){
  let x=((i*185-camera*.22)%(w+90)+(w+90))%(w+90);
  let y=45+i%3*35;
  ctx.fillRect(x,y+10,48,14);
  ctx.fillRect(x+12,y,28,20);
 }
 camera=Math.max(0,Math.min(p.x-w*.38,W*S-w));
 for(let y=0;y<H;y++){
  for(let x=Math.floor(camera/S);x<Math.min(W,Math.ceil((camera+w)/S)+1);x++){
   let b=block(x,y);
   if(!b)continue;
   let px=x*S-camera,py=y*S;
   ctx.fillStyle=colors[b];
   ctx.fillRect(px,py,S,S);
   ctx.strokeStyle='#0003';
   ctx.strokeRect(px,py,S,S);
   if(b===1){
    ctx.fillStyle='#8ce45a';
    ctx.fillRect(px,py,S,5);
   }
  }
 }
 let x=p.x-camera,y=p.y;
 ctx.fillStyle='#e9b982';
 ctx.fillRect(x+5,y,13,12);
 ctx.fillStyle='#276fbd';
 ctx.fillRect(x+3,y+12,17,11);
 ctx.fillStyle='#303b65';
 ctx.fillRect(x+3,y+23,7,6);
 ctx.fillRect(x+13,y+23,7,6);
 ctx.fillStyle='#222';
 ctx.fillRect(x+14,y+4,3,3);
}
function update(){
 p.x+=(keys.right?2.8:0)-(keys.left?2.8:0);
 if(keys.jump&&p.ground){
  p.vy=-9.5;
  p.ground=false;
 }
 p.vy+=.45;
 p.y+=p.vy;
 let cx=Math.floor((p.x+p.w/2)/S);
 let feet=Math.floor((p.y+p.h)/S);
 if(block(cx,feet)){
  p.y=feet*S-p.h;
  p.vy=0;
  p.ground=true;
 }else p.ground=false;
 if(p.y>H*S){p.y=4*S;p.vy=0;}
 p.x=Math.max(0,Math.min(W*S-p.w,p.x));
}
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
resize();
loop();

c.addEventListener('pointerdown',e=>{
 let r=c.getBoundingClientRect();
 let x=Math.floor((e.clientX-r.left+camera)/S);
 let y=Math.floor((e.clientY-r.top)/S);
 if(x<0||x>=W||y<0||y>=H)return;
 if(mode==='break'){
  map[y][x]=0;
 }else{
  let px=Math.floor((p.x+p.w/2)/S);
  let py=Math.floor((p.y+p.h/2)/S);
  if(!block(x,y)&&!(x===px&&y===py))map[y][x]=selected;
 }
});

document.getElementById('break').onclick=()=>{
 mode='break';
 document.getElementById('break').classList.add('active');
 document.getElementById('place').classList.remove('active');
};
document.getElementById('place').onclick=()=>{
 mode='place';
 document.getElementById('place').classList.add('active');
 document.getElementById('break').classList.remove('active');
};
function choose(id,n){
 selected=n;
 ['grass','stone','wood'].forEach(k=>document.getElementById(k).classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
document.getElementById('grass').onclick=()=>choose('grass',1);
document.getElementById('stone').onclick=()=>choose('stone',3);
document.getElementById('wood').onclick=()=>choose('wood',4);

function hold(id,k){
 let b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();
  keys[k]=true;
 });
 ['pointerup','pointerleave','pointercancel'].forEach(v=>
  b.addEventListener(v,()=>keys[k]=false)
 );
}
hold('left','left');
hold('right','right');
hold('jump','jump');

document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
 if(e.key===' '||e.key==='ArrowUp')keys.jump=true;
});
document.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
 if(e.key===' '||e.key==='ArrowUp')keys.jump=false;
});
</script>
</body>
  </html>
